      <circle cx="18" cy="18" r="2.2" fill="#e2e8f0" fill-opacity="0.8"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <rect x="90" y="106" width="760" height="470" rx="26" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.32"/>
  <rect x="124" y="154" width="520" height="320" rx="14" fill="url(#pcbGrid)"/>

  <g fill="none" stroke="#93c5fd" stroke-width="2.2" opacity="0.75">
