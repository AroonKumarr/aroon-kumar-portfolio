  <text x="916" y="222" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">Open Circuit</text>
  <rect x="916" y="238" width="248" height="8" rx="4" fill="#1e293b"/>
  <rect x="916" y="238" width="214" height="8" rx="4" fill="#22d3ee"/>

