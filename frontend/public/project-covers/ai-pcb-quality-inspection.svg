    <text x="300" y="384" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">class: open-circuit</text>
    <text x="300" y="408" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e2e8f0">confidence: 0.96</text>
  </g>

  <rect x="884" y="122" width="312" height="430" rx="20" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.36"/>
