<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Restaurant Name Generator workflow snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081320"/>
      <stop offset="56%" stop-color="#1a2f47"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.93"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" fill="#f8fafc" font-weight="700">Workflow Snapshot</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">Prompt input -> Name ideas -> Menu ideas -> Iterate and finalize</text>

  <rect x="50" y="176" width="214" height="98" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="157" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Input Cuisine</text>

  <rect x="302" y="176" width="214" height="98" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="409" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Generate Names</text>

  <rect x="554" y="176" width="214" height="98" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="661" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Build Menus</text>

  <rect x="806" y="176" width="214" height="98" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="913" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Review Fit</text>

  <rect x="1058" y="176" width="172" height="98" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="1144" y="223" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#e2e8f0" font-weight="600">Refine</text>
  <text x="1144" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bae6fd">Prompt Loop</text>

  <line x1="264" y1="225" x2="302" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="516" y1="225" x2="554" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="768" y1="225" x2="806" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1020" y1="225" x2="1058" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="84" y="326" width="558" height="308" rx="18" fill="#0f172a" fill-opacity="0.84" stroke="#38bdf8" stroke-opacity="0.44"/>
  <text x="116" y="370" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Generated Outputs</text>
  <text x="116" y="416" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- 5 to 10 naming options per run</text>
  <text x="116" y="452" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Tone-guided brand direction</text>
  <text x="116" y="488" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Menu concepts by section</text>
  <text x="116" y="524" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Easy rerun with tighter constraints</text>

  <rect x="672" y="326" width="536" height="308" rx="18" fill="#0f172a" fill-opacity="0.84" stroke="#38bdf8" stroke-opacity="0.44"/>
  <text x="704" y="370" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">User Interaction</text>
  <rect x="704" y="406" width="472" height="54" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="728" y="439" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">1. Enter cuisine and style direction</text>
  <rect x="704" y="478" width="472" height="54" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="728" y="511" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">2. Review generated names and menus</text>
  <rect x="704" y="550" width="472" height="54" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="728" y="583" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">3. Regenerate until concept is approved</text>
</svg>
