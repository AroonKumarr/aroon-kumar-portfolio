  <text x="118" y="560" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">Decision threshold applied before final label selection</text>

  <rect x="664" y="332" width="544" height="286" rx="18" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="696" y="374" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Runtime Stages</text>

  <rect x="696" y="410" width="480" height="42" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="720" y="438" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">1. Validate face region and both eyes</text>

  <rect x="696" y="464" width="480" height="42" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="720" y="492" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">2. Extract wavelet + spatial features</text>

  <rect x="696" y="518" width="480" height="42" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="720" y="546" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">3. Predict class and return confidence JSON</text>
