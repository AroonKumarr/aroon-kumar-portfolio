<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Celebrity Face Classifier workflow snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="58%" stop-color="#12263a"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.92"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Workflow Snapshot</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">Upload -> Detect -> Transform -> Classify</text>

  <rect x="52" y="176" width="206" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="155" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Upload Image</text>

  <rect x="306" y="176" width="220" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="416" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Face Detection</text>
  <text x="416" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">reject invalid crops</text>

  <rect x="574" y="176" width="228" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="688" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Wavelet Features</text>
  <text x="688" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">frequency signatures</text>

  <rect x="850" y="176" width="376" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="1038" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">SVM Prediction + Probability</text>
  <text x="1038" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">top classes and confidence</text>

  <line x1="258" y1="225" x2="306" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="526" y1="225" x2="574" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="802" y1="225" x2="850" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="84" y="332" width="544" height="286" rx="18" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="116" y="374" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Class Probability Chart</text>

