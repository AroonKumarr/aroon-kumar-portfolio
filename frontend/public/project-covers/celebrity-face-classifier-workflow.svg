  <rect x="118" y="414" width="352" height="18" rx="9" fill="#22d3ee"/>
  <text x="548" y="428" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e2e8f0">Celebrity A 0.91</text>

  <rect x="118" y="454" width="420" height="18" rx="9" fill="#1e293b"/>
  <rect x="118" y="454" width="178" height="18" rx="9" fill="#38bdf8"/>
  <text x="548" y="468" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e2e8f0">Celebrity B 0.44</text>

  <rect x="118" y="494" width="420" height="18" rx="9" fill="#1e293b"/>
  <rect x="118" y="494" width="122" height="18" rx="9" fill="#67e8f9"/>
