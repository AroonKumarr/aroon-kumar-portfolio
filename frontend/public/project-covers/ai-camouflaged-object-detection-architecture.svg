    <line x1="350" y1="276" x2="350" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="640" y1="276" x2="640" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="930" y1="276" x2="930" y2="360" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="64" y="530" width="1152" height="124" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.38"/>
  <text x="94" y="574" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Model Highlights:</text>
  <text x="94" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- SINet with attention-guided localization</text>
  <text x="560" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Multi-stage decoder for fine object boundaries</text>
</svg>
