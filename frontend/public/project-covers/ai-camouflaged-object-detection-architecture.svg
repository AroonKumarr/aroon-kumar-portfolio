    <text x="174" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Input Image</text>

    <rect x="352" y="180" width="220" height="96" rx="14" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="462" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Backbone</text>
    <text x="462" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">ResNet Feature Maps</text>

    <rect x="640" y="180" width="220" height="96" rx="14" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="750" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Search Attention</text>
    <text x="750" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">Context Focus</text>

    <rect x="928" y="180" width="220" height="96" rx="14" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="1038" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Output Mask</text>
    <text x="1038" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">Detected Object Region</text>
  </g>

  <g>
    <line x1="284" y1="228" x2="352" y2="228" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="572" y1="228" x2="640" y2="228" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="860" y1="228" x2="928" y2="228" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="224" y="360" width="252" height="84" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.48"/>
    <text x="350" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">RF Block</text>

    <rect x="514" y="360" width="252" height="84" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.48"/>
    <text x="640" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">PDC Decoder</text>

    <rect x="804" y="360" width="252" height="84" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.48"/>
    <text x="930" y="408" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Boundary Refinement</text>
