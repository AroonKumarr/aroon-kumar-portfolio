<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="AigilityX AI Platform workflow snapshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081220"/>
      <stop offset="58%" stop-color="#12263a"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.92"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Workflow Snapshot</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">Voice Input -> Agent Reasoning -> Voice Response</text>

  <rect x="50" y="176" width="194" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="147" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">User Speech</text>

  <rect x="286" y="176" width="194" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="383" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">STT Parse</text>

  <rect x="522" y="176" width="214" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="629" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">RAG Retrieval</text>
  <text x="629" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">context grounding</text>

  <rect x="778" y="176" width="220" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="888" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Agent Planning</text>
  <text x="888" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">tool calls</text>

  <rect x="1040" y="176" width="194" height="98" rx="12" fill="url(#card)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="1137" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">TTS Reply</text>

  <line x1="244" y1="225" x2="286" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="480" y1="225" x2="522" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="736" y1="225" x2="778" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="998" y1="225" x2="1040" y2="225" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="86" y="334" width="560" height="286" rx="18" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="118" y="376" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Realtime Timeline</text>
  <text x="118" y="424" font-family="Inter, Arial, sans-serif" font-size="19" fill="#bae6fd">00ms  Input audio packet received</text>
  <text x="118" y="460" font-family="Inter, Arial, sans-serif" font-size="19" fill="#bae6fd">120ms  STT partial transcript available</text>
  <text x="118" y="496" font-family="Inter, Arial, sans-serif" font-size="19" fill="#bae6fd">290ms  RAG context injected into prompt</text>
  <text x="118" y="532" font-family="Inter, Arial, sans-serif" font-size="19" fill="#bae6fd">510ms  Agent response token stream starts</text>
  <text x="118" y="568" font-family="Inter, Arial, sans-serif" font-size="19" fill="#bae6fd">760ms  TTS synthesis returns voice output</text>

  <rect x="686" y="334" width="508" height="286" rx="18" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="718" y="376" font-family="Inter, Arial, sans-serif" font-size="26" fill="#f8fafc" font-weight="700">Session State</text>

  <rect x="718" y="412" width="444" height="48" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="740" y="442" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">intent: explain_model_performance</text>

  <rect x="718" y="476" width="444" height="48" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="740" y="506" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">tools: retriever, metrics_db, summarizer</text>

  <rect x="718" y="540" width="444" height="48" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.34"/>
  <text x="740" y="570" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0">memory: persisted to Supabase</text>
