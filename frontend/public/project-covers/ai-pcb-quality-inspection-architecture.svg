<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="AI PCB Quality Inspection architecture view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Architecture View</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">AI PCB Quality Inspection</text>

  <rect x="62" y="186" width="208" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="166" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Camera Feed</text>

  <rect x="336" y="186" width="224" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="448" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Preprocessing</text>
  <text x="448" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">crop, normalize, denoise</text>

  <rect x="626" y="186" width="234" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="743" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">ResNet-18 Backbone</text>
  <text x="743" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">feature extraction</text>

  <rect x="926" y="186" width="290" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="1071" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Multi-label Classifier</text>
  <text x="1071" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">6 defect categories</text>

  <line x1="270" y1="232" x2="336" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="560" y1="232" x2="626" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="860" y1="232" x2="926" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="156" y="348" width="318" height="112" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="315" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Quality Scoring</text>
  <text x="315" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">confidence and severity index</text>

  <rect x="502" y="348" width="318" height="112" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="661" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Defect Localization</text>
  <text x="661" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">bounding boxes and overlays</text>

  <rect x="848" y="348" width="318" height="112" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="1007" y="394" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">QA Report Engine</text>
  <text x="1007" y="424" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">pass/fail + traceability logs</text>

  <line x1="315" y1="280" x2="315" y2="348" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="661" y1="280" x2="661" y2="348" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1007" y1="280" x2="1007" y2="348" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="530" width="1152" height="124" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.38"/>
  <text x="94" y="574" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Industrial Targets:</text>
  <text x="94" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Low-latency inference for production lines</text>
  <text x="626" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Automated QC reports for operators</text>
</svg>
