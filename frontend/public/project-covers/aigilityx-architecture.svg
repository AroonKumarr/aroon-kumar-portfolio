<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="AigilityX AI Platform architecture view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Architecture View</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">AigilityX AI Platform</text>

  <rect x="62" y="178" width="188" height="90" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="156" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Client App</text>

  <rect x="300" y="178" width="220" height="90" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="410" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="600">API Gateway</text>
  <text x="410" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">auth + routing</text>

  <rect x="570" y="178" width="214" height="90" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="677" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e2e8f0" font-weight="600">Agent Core</text>
  <text x="677" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">planning + tools</text>

  <rect x="834" y="178" width="174" height="90" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="921" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">RAG</text>

  <rect x="1058" y="178" width="160" height="90" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.5"/>
  <text x="1138" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">TTS/STT</text>

  <line x1="250" y1="223" x2="300" y2="223" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="520" y1="223" x2="570" y2="223" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="784" y1="223" x2="834" y2="223" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1008" y1="223" x2="1058" y2="223" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="148" y="330" width="290" height="108" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="293" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Supabase DB</text>
  <text x="293" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">sessions, logs, vectors</text>

  <rect x="496" y="330" width="290" height="108" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="641" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Realtime Bus</text>
  <text x="641" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">event streaming</text>

  <rect x="844" y="330" width="290" height="108" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.46"/>
  <text x="989" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Observability</text>
  <text x="989" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">traces and metrics</text>

  <line x1="293" y1="268" x2="293" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="641" y1="268" x2="641" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="989" y1="268" x2="989" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="528" width="1152" height="126" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#22d3ee" stroke-opacity="0.38"/>
  <text x="94" y="574" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Core Design:</text>
  <text x="94" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Modular services for independent scaling</text>
  <text x="660" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Gateway + agent orchestration + persistent memory</text>
