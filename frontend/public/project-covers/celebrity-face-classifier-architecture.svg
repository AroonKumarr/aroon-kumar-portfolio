<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Celebrity Face Classifier architecture view">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280"/>
    <path d="M160 0 V720 M320 0 V720 M480 0 V720 M640 0 V720 M800 0 V720 M960 0 V720 M1120 0 V720"/>
  </g>

  <text x="64" y="78" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Architecture View</text>
  <text x="64" y="116" font-family="Inter, Arial, sans-serif" font-size="22" fill="#bae6fd">Celebrity Face Classifier</text>

  <rect x="58" y="186" width="220" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="168" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#e2e8f0" font-weight="600">Image Upload</text>

  <rect x="332" y="186" width="220" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="442" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Face + Eye Detect</text>
  <text x="442" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">OpenCV Haar Cascades</text>

  <rect x="606" y="186" width="230" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="721" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">Feature Extractor</text>
  <text x="721" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">Wavelet + Raw Pixels</text>

  <rect x="890" y="186" width="332" height="94" rx="12" fill="url(#box)" stroke="#22d3ee" stroke-opacity="0.52"/>
  <text x="1056" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#e2e8f0" font-weight="600">SVM Classification</text>
  <text x="1056" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#bae6fd">label + probability scores</text>

  <line x1="278" y1="232" x2="332" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="552" y1="232" x2="606" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="836" y1="232" x2="890" y2="232" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="124" y="344" width="326" height="114" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="287" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Model Artifacts</text>
  <text x="287" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">saved scaler, SVM, class map</text>

  <rect x="476" y="344" width="326" height="114" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="639" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Flask API Layer</text>
  <text x="639" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">/classify endpoint</text>

  <rect x="828" y="344" width="326" height="114" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="991" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Dropzone UI</text>
  <text x="991" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">upload -> result preview</text>

  <line x1="287" y1="280" x2="287" y2="344" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="639" y1="280" x2="639" y2="344" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="991" y1="280" x2="991" y2="344" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="530" width="1152" height="124" rx="14" fill="#0f172a" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.38"/>
  <text x="94" y="574" font-family="Inter, Arial, sans-serif" font-size="24" fill="#e2e8f0" font-weight="600">Pipeline Goals:</text>
  <text x="94" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Robust face validation using eye detection</text>
  <text x="610" y="610" font-family="Inter, Arial, sans-serif" font-size="20" fill="#bae6fd">- Fast and explainable class probabilities</text>
</svg>
